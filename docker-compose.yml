services:
  db:
    image: postgres:17
    container_name: koinoxrista-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - koinoxrista-pgdata:/var/lib/postgresql/data

volumes:
  koinoxrista-pgdata: