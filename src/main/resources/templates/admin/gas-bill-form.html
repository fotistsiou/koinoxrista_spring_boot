<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Νέος λογαριασμός αερίου</title>
</head>
<body>
<h1>Νέος μηνιαίος λογαριασμός αερίου</h1>
<p><a th:href="@{/admin/bills/new}">Απλός λογαριασμός (ρεύμα, βλάβη, συντήρηση, απολύμανση) →</a></p>

<p th:if="${successMessage}" th:text="${successMessage}"></p>

<form th:action="@{/admin/gas-bills}" th:object="${gasBillForm}" method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>

    <div>
        <label for="categoryId">Κατηγορία</label>
        <select id="categoryId" th:field="*{categoryId}">
            <option value="">-- Επίλεξε κατηγορία --</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}" th:text="${category.name}"></option>
        </select>
        <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
    </div>

    <div>
        <label for="amount">Ποσό λογαριασμού (€)</label>
        <input id="amount" type="number" step="0.01" th:field="*{amount}">
        <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
    </div>

    <div>
        <label for="consumptionCharge">Κατανάλωση Ω (€)</label>
        <input id="consumptionCharge" type="number" step="0.01" th:field="*{consumptionCharge}">
        <span th:if="${#fields.hasErrors('consumptionCharge')}" th:errors="*{consumptionCharge}"></span>
    </div>

    <div>
        <label for="meterFloor">Ένδειξη μετρητή ορόφου (Μ1)</label>
        <input id="meterFloor" type="number" step="1" th:field="*{meterFloor}">
        <span th:if="${#fields.hasErrors('meterFloor')}" th:errors="*{meterFloor}"></span>
    </div>

    <div>
        <label for="meterTotal">Ένδειξη γενικού μετρητή (ΜΣ)</label>
        <input id="meterTotal" type="number" step="1" th:field="*{meterTotal}">
        <span th:if="${#fields.hasErrors('meterTotal')}" th:errors="*{meterTotal}"></span>
    </div>

    <div>
        <label for="meterApartmentId">Διαμέρισμα μετρητή ορόφου</label>
        <select id="meterApartmentId" th:field="*{meterApartmentId}">
            <option value="">-- Επίλεξε διαμέρισμα --</option>
            <option th:each="apartment : ${apartments}"
                    th:value="${apartment.id}" th:text="${apartment.name}"></option>
        </select>
        <span th:if="${#fields.hasErrors('meterApartmentId')}" th:errors="*{meterApartmentId}"></span>
    </div>

    <div>
        <label for="billDate">Ημερομηνία</label>
        <input id="billDate" type="date" th:field="*{billDate}">
        <span th:if="${#fields.hasErrors('billDate')}" th:errors="*{billDate}"></span>
    </div>

    <button type="submit">Καταχώριση</button>
</form>
</body>
</html>
